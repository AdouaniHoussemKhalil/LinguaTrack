version: "3.9"

services:
  api:
    build: .
    container_name: linguatrack_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/linguatrack
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: linguatrack_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linguatrack
    ports:
      - "5432:5432"