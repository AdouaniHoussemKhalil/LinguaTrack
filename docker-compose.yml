services:
  api:
    build: .
    container_name: linguatrack_api
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    environment:
      # Remplace la DATABASE_URL de app/.env : l'API parle au conteneur PostgreSQL
      DATABASE_URL: postgresql://postgres:postgres@db:5432/linguatrack
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: linguatrack_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linguatrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linguatrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
